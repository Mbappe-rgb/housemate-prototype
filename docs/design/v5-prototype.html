var AT=Date.now();setInterval(()=>{if(S.ph=='intro'&&Date.now()-AT>=4800)igo((I_+1)%3)},600);
function igo(i){AT=Date.now();I_=Math.max(0,Math.min(2,i));const e=document.querySelector('.intro');if(e)e.dataset.i=I_}
function dtog(){const d=document.querySelector('.v2.dash');if(!d)return;DP=DP>.5?0:1;snapTo(d)}
function snapTo(d){d.classList.add('snap');d.style.setProperty('--p',DP);clearTimeout(snapTo.t);snapTo.t=setTimeout(()=>d.classList.remove('snap'),420)}
(function(){let sx=null,wt;
document.addEventListener('touchstart',e=>{sx=e.target.closest&&e.target.closest('.intro')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)igo(I_+(dx<0?1:-1))});
document.addEventListener('keydown',e=>{if(!document.querySelector('.intro'))return;if(e.key=='ArrowRight')igo(I_+1);if(e.key=='ArrowLeft')igo(I_-1)});
const settle=()=>{const d=document.querySelector('.v2.dash');if(!d)return;DP=DP>.5?1:0;snapTo(d)};
document.addEventListener('wheel',e=>{if(e.target.closest&&e.target.closest('.dash')){clearTimeout(wt);wt=setTimeout(settle,140)}},{passive:true});
document.addEventListener('touchend',e=>{if(e.target.closest&&e.target.closest('.dash'))settle()});
})();

function calpd(){if(!S.cal)return'';const H=S.ct=='hist',ms=H?[0,1,2,3]:[2,3],m=MS[S.cm],off=(((m.s-1)%7)+7)%7,lo=S.ca&&S.cbe?Math.min(S.ca,S.cbe):S.ca,hi=S.ca&&S.cbe?Math.max(S.ca,S.cbe):S.ca;
const mk=d=>{const hb=S.bills.some(b=>b.d==d&&(H?!todo(b)&&d<=T:todo(b))),hcc=S.chores.some(c=>c.d==d&&c.w==ME&&(H?c.x&&d<=T:!c.x));return `<span class="wc ${hb||hcc?'on':''}">${hb?ic('bill',14):''}${hcc?ic('chore',14):''}</span>`};
let c='';for(let i=0;i<off;i++)c+='<i></i>';
for(let n=1;n<=m.l;n++){const d=m.s+n-1,inr=S.cp&&lo!=null&&d>=lo&&d<=hi,cls=(inr?(d==lo?'cra ':d==hi?'crb ':'crm '):'')+(S.cp&&lo&&hi==lo&&d==lo?'cra crb ':'')+(!S.cp&&S.cs==d?'sel':'');c+=`<button class="wd cd ${d==T?'td':''} ${cls}" onclick="cpick(${d})" aria-label="${dl(d)}">${mk(d)}<b>${n}</b></button>`}
const ready=S.cp?(S.ca&&S.cbe):S.cs!=null&&S.cs!==0,hint=S.cp?(!S.ca?'Tap a start date':!S.cbe?'Now tap an end date':lab(lo)+' – '+lab(hi)):(ready?dl(S.cs):'Tap a date, or switch to Period for a range');
return `<div class="psheet top" onclick="calt()"><div class="pp calsh" onclick="event.stopPropagation()" role="dialog" aria-label="Calendar"><div class="gr"></div><div class="top"><button class="ib" onclick="calt()" aria-label="Back">${ic('left',20)}</button><div style="flex:1"><b style="font-size:20px">${H?'Pick dates':'Calendar'}</b><small>${H?'For your report':'Date or period'}</small></div>${H?'':`<button class="hbt" onclick="hopen()">${ic('bill',16)}Reports</button>`}</div>
<div class="chd"><div class="cmode"><button class="${!S.cp?'on':''}" onclick="cpm(0)">Date</button><button class="${S.cp?'on':''}" onclick="cpm(1)">Period</button></div></div>
<div class="chint ${ready?'ok':''}">${S.cp?ic('cal',14):''}<span>${hint}</span>${(S.cp&&S.ca)||(!S.cp&&ready)?`<button class="chc" onclick="S.ca=0;S.cbe=0;S.cs=null;r()">Clear</button>`:''}</div>
<div class="cnav"><button onclick="cmv(-1)" ${S.cm<=ms[0]?'disabled':''} aria-label="Previous month">${ic('left',20)}</button><b>${m.n} 2026</b><button onclick="cmv(1)" ${S.cm>=ms[ms.length-1]?'disabled':''} aria-label="Next month">${ic('right',20)}</button></div>
<div class="cwk">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cgr">${c}</div>
<div class="cft"><span>${ic('bill',14)}Bills</span><span>${ic('chore',14)}Chores</span><button class="lk2b" onclick="cpick(${T})">Today</button></div>
<button class="btn capp" onclick="capply()" ${ready?'':'disabled'}>${H?(S.cp?'Use this period':'Use this date'):(S.cp?'View period':'View selected date')}</button></div></div>`}
function calt(){S.cal=S.cal?0:1;if(S.cal){S.ct='plan';S.cp=0;S.ca=0;S.cbe=0;S.cs=S.sr=='day'?S.sd:null;S.cm=2}r()}
function cpm(x){S.cp=x;S.ca=0;S.cbe=0;r()}
function cmv(n){const ms=S.ct=='hist'?[0,1,2,3]:[2,3];S.cm=Math.max(ms[0],Math.min(ms[ms.length-1],S.cm+n));r()}
function cpick(d){if(S.cp){if(!S.ca||S.cbe){S.ca=d;S.cbe=0}else{S.cbe=d}}else S.cs=d;r()}
function capply(){const H=S.ct=='hist';let lo,hi;if(S.cp){lo=Math.min(S.ca,S.cbe);hi=Math.max(S.ca,S.cbe)}else{lo=hi=S.cs}S.cal=0;
if(H){S.hm='period';S.hf=lo;S.ht=hi}else if(S.cp){S.sr='period';S.pf=lo;S.pt=hi;S.ty='all'}else{S.sr='day';S.sd=lo;S.ty='all'}r()}
function hpick(){S.cal=1;S.ct='hist';S.cp=1;S.ca=S.hf;S.cbe=S.ht;S.cs=null;S.cm=MS.indexOf(mof(S.hf));r()}
