<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HouseMate: onboarding and dashboard (A)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:Figtree,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s}

.chip{display:inline-flex;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;margin:0 0 8px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.chip.ok{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}

.dots{display:flex;gap:3px;height:6px}.dots s{width:5px;height:5px;border-radius:50%;background:var(--acc);display:block}.dots s.w{background:var(--warn)}.t .dots s,.sl .dots s{background:var(--on)}
.qa{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.qa button{flex:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink);padding:10px 14px;border-radius:99px;background:var(--card);border:0;cursor:pointer}
.nw{position:absolute;left:18px;right:18px;bottom:16px;display:flex;gap:10px;align-items:center}

.dy.td{color:var(--acc)}.dy.sl{background:var(--btn);color:var(--on)}
.pill{display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:12px}.pill b{font-size:24px;letter-spacing:-.02em}.pill div{flex:1;line-height:1.2}

.empty{padding:20px;text-align:center;color:var(--mute);font-size:14px}
.dots s.c{background:transparent;border:1.5px solid var(--acc)}.t .dots s.c,.sl .dots s.c{background:transparent;border-color:var(--on)}
.psheet{position:absolute;inset:0;z-index:9;background:rgba(10,15,30,.38);display:flex;align-items:flex-end;backdrop-filter:blur(3px);animation:fd .25s}

.hero small.nx{margin-bottom:10px;font-size:14px}
.seg{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}.seg i{width:16px;height:5px;border-radius:9px;background:var(--track)}.seg i.on{background:var(--acc)}.pg{display:block;margin-top:3px}

.pt{display:flex;align-items:center;gap:7px}

else if(st=='ready'){const n=O.sent.length;h=`${obh('invite',3)}<div class="obm"><div class="logo">🎉</div><h1>${O.hh} is ready</h1><p>${n?n+' invite'+(n>1?'s':'')+' sent. They’ll show up here once they join.':'Invite people any time with an email, link or QR code.'}</p></div><button class="btn" onclick="ofin()">Go to dashboard</button>`}
else if(st=='join')h=`${obh('welcome')}<h1>Join a household</h1><p>Paste the invite link you were sent, or type the code.</p><input class="fld" placeholder="Invite link or code" value="${O.jc}" oninput="ocode(this.value)" aria-label="Invite link or code"><button class="btn sec" style="margin-top:10px" onclick="say('The camera opens here in the app')">Scan a QR code</button><div style="flex:1"></div><button class="btn" id="ojb" onclick="ob('jconf')" ${O.jc.trim().length>=4?'':'disabled'}>Continue</button>`;
else h=`${obh('join')}<h1>Join this household?</h1><div class="card lk2" style="text-align:center;padding:22px"><div class="logo" style="margin:0 auto 10px">🏠</div><b style="font-size:20px">Weber street household</b><small style="display:block;margin:4px 0 14px">3 housemates</small><div class="avs">${['Bankole','Ola','Dave'].map(m=>av(m,46)).join('')}</div></div><div style="flex:1"></div><button class="btn" onclick="ofin(1)">Join household</button><button class="lk" onclick="ob('join')">Not this one</button>`;
return `<div class="ob">${h}</div>${t}`}
function ob(s){O.step=s;S.ns=1;r()}function oname(v){O.hh=v;const b=document.getElementById('onx');if(b)b.disabled=!v.trim()}
function otab(t){O.tab=t;r()}function ocode(v){O.jc=v;const b=document.getElementById('ojb');if(b)b.disabled=v.trim().length<4}
function oadd(){const e=O.mail.trim();if(/^\S+@\S+\.\S+$/.test(e)&&!O.emails.includes(e)){O.emails.push(e);O.mail='';O.rf=1;r()}else if(e)say('Check that email address')}
function orm(i){O.emails.splice(i,1);r()}function osend(){const p=O.emails.filter(e=>!O.sent.includes(e));O.sent=O.sent.concat(p);say('Invites sent to '+p.length+(p.length>1?' people':' person'))}
function orst(){O.code='WEBR-'+Math.random().toString(36).slice(2,6).toUpperCase();say('Link reset');}
function oshare(){try{if(navigator.share){navigator.share({title:'Join '+O.hh,url:'https://'+lnk()}).catch(()=>{});return}}catch(e){}cp(lnk())}
function ofin(j){if(!j)S.hh=O.hh;else S.hh='Weber street household';S.ph='app';S.tab.a='ho';S.ns=1;r()}
function drawQR(){const e=document.getElementById('qr');if(!e&&O.rf&&0)return;if(e&&typeof QRCode!='undefined'){e.innerHTML='';try{new QRCode(e,{text:'https://'+lnk(),width:176,height:176,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(x){}}if(O.rf){O.rf=0;const m=document.getElementById('omail');if(m)m.focus()}}
let A_;const areset=()=>{A_={step:'landing',email:'',pw:'',name:'',show:0,err:'',sent:0}};areset();
const PAL=[['lime','Lime'],['sage','Sage'],['midnight','Midnight'],['pop','Pop']];
const aback=b=>`<div class="obh"><button class="ib" onclick="au('${b}')" aria-label="Back">${ic('bk',20)}</button><span style="flex:1"></span><span style="width:46px"></span></div>`;
const social=()=>`<div class="two"><button class="btn sec" onclick="asoc('Apple')">Apple</button><button class="btn sec" onclick="asoc('Google')">Google</button></div><div class="or"><span>or use email</span></div>`;
const pwf=(ac,ph)=>`<div class="pw"><input class="fld" type="${A_.show?'text':'password'}" autocomplete="${ac}" placeholder="${ph}" value="${A_.pw}" oninput="A_.pw=this.value" onkeydown="if(event.key=='Enter')${A_.step=='reg'?'areg()':'alogin()'}" aria-label="Password"><button class="eye" onclick="ashow()" aria-label="${A_.show?'Hide':'Show'} password">${A_.show?'Hide':'Show'}</button></div>`;
const emf=()=>`<input class="fld" type="email" inputmode="email" autocomplete="email" placeholder="Email" value="${A_.email}" oninput="A_.email=this.value" aria-label="Email">`;
const err=()=>A_.err?`<small class="err" role="alert">${A_.err}</small>`:'';
function auth(){const st=A_.step;let h='';
if(st=='landing')h=`<div class="obm"><div class="logo">🏠</div><h1>HouseMate</h1><p>Split bills, share chores and keep the peace at home.</p></div><button class="btn" onclick="au('reg')">Create account</button><button class="btn sec" style="margin-top:10px" onclick="au('login')">Log in</button>`;
else if(st=='login')h=`${aback('landing')}<h1>Welcome back</h1><p>Log in to see what’s due.</p>${social()}${emf()}${pwf('current-password','Password')}${err()}<button class="lk2b" style="margin:12px 2px;text-align:left" onclick="au('forgot')">Forgot password?</button><div style="flex:1"></div><button class="btn" onclick="alogin()">Log in</button><button class="lk" onclick="au('reg')">New here? Create an account</button>`;
else if(st=='reg')h=`${aback('landing')}<h1>Create your account</h1><p>It only takes a minute.</p>${social()}<input class="fld" autocomplete="name" placeholder="First name" value="${A_.name}" oninput="A_.name=this.value" aria-label="First name">${emf().replace('<input class="fld"','<input class="fld" style="margin-top:10px"')}${pwf('new-password','Password, 8+ characters')}${err()}<div style="flex:1;min-height:14px"></div><button class="btn" onclick="areg()">Create account</button><button class="lk" onclick="au('login')">Already have an account? Log in</button>`;
else h=`${aback('login')}<h1>Reset your password</h1><p>Enter your email and we’ll send you a link to choose a new one.</p>${emf()}${err()}${A_.sent?`<div class="card lk2" style="margin-top:14px"><b>Check your inbox</b><small style="display:block;margin-top:4px">If ${A_.email.trim()} has an account, a reset link is on its way.</small></div>`:''}<div style="flex:1"></div><button class="btn" onclick="aforgot()">${A_.sent?'Send again':'Send reset link'}</button>`;
return `<div class="ob">${h}</div>${toast()}`}
const okmail=e=>/^\S+@\S+\.\S+$/.test(e.trim());
function au(s){A_.step=s;A_.err='';A_.sent=0;S.ns=1;r()}function ashow(){A_.show=!A_.show;r()}
function alogin(){if(!okmail(A_.email)){A_.err='Enter a valid email address.';r();return}if(!A_.pw){A_.err='Enter your password.';r();return}S.ph='app';S.tab.a='ho';S.ns=1;say('Welcome back')}
function areg(){const n=A_.name.trim().split(/\s+/)[0];if(!n){A_.err='Add your first name.';r();return}if(!okmail(A_.email)){A_.err='Enter a valid email address.';r();return}if(A_.pw.length<8){A_.err='Use at least 8 characters for your password.';r();return}rename(n[0].toUpperCase()+n.slice(1));ACC[ME].em=A_.email.trim();O=OINIT();S.ph='onb';S.ns=1;say('Account created')}
function aforgot(){if(!okmail(A_.email)){A_.err='Enter a valid email address.';r();return}A_.err='';A_.sent=1;r()}
function asoc(p){if(A_.step=='reg'){O=OINIT();S.ph='onb'}else{S.ph='app';S.tab.a='ho'}S.ns=1;say('Signed in with '+p)}
function rename(nn){if(!nn||nn==ME||MB.includes(nn))return;const o=ME;S.bills.forEach(b=>{if(b.by==o)b.by=nn;if(b.pr==o)b.pr=nn;b.pd[nn]=b.pd[o];delete b.pd[o];if(b.sp){b.sp[nn]=b.sp[o];delete b.sp[o]}});S.chores.forEach(c=>{if(c.w==o)c.w=nn});ACC[nn]=ACC[o];delete ACC[o];MB[0]=nn;ME=nn}
const OINIT=()=>({step:'welcome',hh:'Weber street household',tab:'email',emails:[],sent:[],mail:'',code:'WEBR-7K4Q',jc:'',rf:0});
function gfset(k){S.px=0;if(k=='auth'||k=='reg'){areset();if(k=='reg')A_.step='reg';S.ph='auth'}else if(k=='onb'){O=OINIT();S.ph='onb'}else{S.ph='app';S.tab.a='ho'}S.ns=1;S.shown=0;r()}
const protoBtn=()=>`<button class="pbtn" onclick="pxo()" aria-label="Prototype controls">${ic('gs',13)}Prototype</button>`;
const protoSheet=()=>{if(!S.px)return'';const st=S.shown?'st':'',ch=(on,f,t)=>`<button class="ch ${on?'on':''}" onclick="${f}">${t}</button>`;
return `<div class="psheet px ${st}" onclick="pxo()"><div class="pp ${st}" onclick="event.stopPropagation()" role="dialog" aria-label="Prototype controls"><div class="gr"></div><div class="top"><div style="flex:1"><b style="font-size:18px">Prototype controls</b><small>Only for exploring this design</small></div></div><h4>Palette</h4><div class="chips">${PAL.map(x=>ch(S.th==x[0],`S.th='${x[0]}';r()`,x[1])).join('')}</div><h4>Data</h4><div class="chips">${[['owe','You owe'],['late','Past due'],['settled','All settled']].map(x=>ch(S.st==x[0],`load('${x[0]}');r()`,x[1])).join('')}</div><h4>Jump to</h4><div class="chips">${[['auth','Log in'],['reg','Register'],['onb','Onboarding'],['app','Dashboard']].map(x=>ch(0,`gfset('${x[0]}')`,x[1])).join('')}</div><button class="btn" style="margin-top:18px" onclick="pxo()">Done</button></div></div>`};
function pxo(){S.px=!S.px;S.shown=0;S.ns=1;r()}
r();
</script></body></html>
